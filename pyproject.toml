[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autograph-rule-engine"
version = "0.1.0"
description = "Graph-based rule management system with auto-discovered dependencies"
requires-python = ">=3.10"
dependencies = [
    # Upper bounds so a major release cannot silently enter the environment. The Lambda
    # layer pins exact versions in requirements-layer.txt; these bounds keep the local
    # test environment in the same compatibility range.
    "networkx>=3.0,<4",
    # Pinned exactly, not range-bounded: Neptune engine 1.5.0.0 supports TinkerPop
    # 3.8.0-3.8.1 only, so `<3.9` was too loose and resolved to 3.8.2 locally — past the
    # engine's ceiling, and out of step with the 3.8.1 pin in requirements-layer.txt.
    # Raise this only alongside the engine's supported Gremlin range.
    "gremlinpython==3.8.1",
    "pydantic>=2.9,<3",
    "simpleeval>=1.0,<2",
    "boto3>=1.26,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "graphviz>=0.20",
    "matplotlib>=3.0",
]
infra = [
    "aws-cdk-lib>=2.100",
    "constructs>=10.0,<11",
    # cdk-nag 3.x removed NagSuppressions; infra/stack.py uses the 2.x API.
    "cdk-nag>=2.28,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autograph_rule_engine = ["py.typed"]
